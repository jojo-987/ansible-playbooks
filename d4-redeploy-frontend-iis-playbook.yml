---
- name: Download and store latest artifact to ubuntu machine
  hosts: hostkp 
  tasks:
    - name: download zip file using url
      ansible.builtin.get_url:
        url: "http://192.168.0.49:8081/service/rest/v1/search/assets/download?sort=version&direction=desc&repository=Interns_Nexus_2026&maven.extension=zip&group=krish.frontend&name=basic-vite"
        dest: ~/Desktop/intern/artifacts/
    - name: find all the artifacts of this project and store it in a variable
      ansible.builtin.find:
        paths: ~/Desktop/intern/artifacts/
        patterns: "basic-vite-*.zip"
      register: all_artifacts
    - name: defining latest_variable for other plays
      ansible.builtin.set_fact:
        latest_variable: "{{ (all_artifacts.files | sort(attribute='mtime') | reverse)[0].path }}"
- name: redeploy latest artifact to windows iis server
  hosts: win_hostkp
  tasks:
    - name: paste latest artifact from ubuntu to server machine 
      ansible.windows.win_copy:
        src: "{{ hostvars['192.168.0.104']['latest_variable']  }}" 
        dest: C:\Users\Administrator\Downloads\artifacts
    - name: find all artifacts of this project and store it is variable
      ansible.windows.win_find:
        paths: C:\Users\Administrator\Downloads\artifacts
        patterns: "basic-vite-*.zip"
      register: all_win_artifacts
    - name: stopping running site before unzipping new content
      community.windows.win_iis_website:
        name: kp-basic-vite
        state: stopped
    - name: stopping running application pool
      community.windows.win_iis_webapppool:
        name: kp-basic-vite
        state: stopped
    - name: creating backup folder
      ansible.windows.win_file:
        path: C:\backup_folder
        state: directory
    - name: copy preserved files to another location
      ansible.windows.win_copy:
        src: "C:\\inetpub\\wwwroot\\kp-basic-vite\\web.config"
        dest: C:\backup_folder
        remote_src: true
    - name: remove previous artifact from root
      ansible.windows.win_file:
        path: C:\inetpub\wwwroot\kp-basic-vite\
        state: absent
    - name: create empty directory at same root
      ansible.windows.win_file:
        path: C:\inetpub\wwwroot\kp-basic-vite\
        state: directory
    - name: readd preserved files
      ansible.windows.win_copy: 
        src: C:\backup_folder\
        dest: C:\inetpub\wwwroot\kp-basic-vite\
        remote_src: true
    - name: remove backup folder
      ansible.windows.win_file:
        path: C:\backup_folder\
        state: absent
    - name: unzip latest 
      community.windows.win_unzip:
        src: "{{ (all_win_artifacts.files | sort(attribute='lastwritetime') | reverse)[0].path }}"
        dest: C:\inetpub\wwwroot\kp-basic-vite\
        remote_src: true
    - name: restarting application pool
      community.windows.win_iis_webapppool:
        name: kp-basic-vite
        state: started
    - name: restarting site
      community.windows.win_iis_website:
        name: kp-basic-vite
        state: started
