---
- name: Deploy artifact on iis and run the application on localhost
  hosts:
    - win_hostkp
  tasks:
    - name: ensure target directory exist
      ansible.windows.win_file:
        path: C:\inetpub\wwwroot\kp-next-todo
        state: directory
    - name: add web.config first
      ansible.windows.win_copy:
        src: ~/Desktop/intern/playbooks/frontend-web-config/web.config
        dest: C:\inetpub\wwwroot\kp-next-todo\
    - name: download zip file using url
      ansible.windows.win_get_url:
        url: "http://192.168.0.49:8081/service/rest/v1/search/assets/download?sort=version&direction=desc&repository=Interns_Nexus_2026&maven.extension=zip&group=krish.frontend&name=next-todo"
        dest: C:\inetpub\wwwroot\kp-next-todo\artifact.zip
    - name: unzip the artifact
      community.windows.win_unzip:
        src: C:\inetpub\wwwroot\kp-next-todo\artifact.zip
        dest: C:\inetpub\wwwroot\kp-next-todo\
        remote_src: true
        delete_archive: true
    - name: create an application pool
      community.windows.win_iis_webapppool:
        name: kp-next-todo
        state: started
    - name: create an IIS website
      community.windows.win_iis_website:
        name: kp-next-todo
        state: started
        port: 80
        ip: '*'
        hostname: '*'
        application_pool: kp-next-todo
        physical_path: C:\inetpub\wwwroot\kp-next-todo\
      register: website
    - name: debug
      debug:
        msg: "{{ website }}" 
    - name: adding https binding using certificate
      community.windows.win_iis_webbinding:
        name: kp-next-todo
        protocol: https
        port: 443
        ip: '*'
        certificate_hash: "D7B1B598EB685D1A88C16BC4FD68B25221C2A483"
        state: present
