---
- name: Deploy artifact on iis
  hosts:
    - win_host
  tasks:
    - name: ensure target directory exist
      ansible.windows.win_file:
        path: C:\inetpub\wwwroot\kp-dotnet-mvc
        state: directory
    - name: download zip file using url
      ansible.windows.win_get_url:
        url: "http://192.168.0.49:8081/service/rest/v1/search/assets/download?sort=version&direction=desc&repository=Interns_Nexus_2026&maven.extension=zip&group=krish.dotnet&name=simple-web-mvc"
        dest: C:\inetpub\wwwroot\kp-dotnet-mvc\dotnet-artifact.zip
    - name: unzip the artifact
      community.windows.win_unzip:
        src: C:\inetpub\wwwroot\kp-dotnet-mvc\dotnet-artifact.zip
        dest: C:\inetpub\wwwroot\kp-dotnet-mvc\
        remote_src: true
        delete_archive: true
    - name: create an application pool
      community.windows.win_iis_webapppool:
        name: kp-dotnet-mvc
        state: started
    - name: create a IIS website
      community.windows.win_iis_website:
        name: kp-dotnet-mvc
        state: started
        port: 80
        ip: '*'
        hostname: '*'
        application_pool: kp-dotnet-mvc
        physical_path: C:\inetpub\wwwroot\kp-dotnet-mvc\
      register: website
